<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>lolPing chat</title>
    <link rel="stylesheet" href="./text.css" />
  </head>
  <body>
    <main class="lol-frame">
      <header id="bar">
        <span id="title"></span>
        <button id="hide" type="button">×</button>
      </header>
      <ol id="log"></ol>
      <div class="row">
        <input id="message" type="text" autocomplete="off" autofocus />
        <span id="count" hidden></span>
      </div>
      <small id="hint"></small>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
