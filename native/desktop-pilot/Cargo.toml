[package]
name = "lolping-desktop-pilot"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.7.6"
serde_json = "=1.0.149"

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.1"
sha2_10 = { package = "sha2", version = "=0.10.9" }
aes-gcm = "=0.10.3"
scrypt = { version = "=0.11.0", default-features = false }
hkdf = "=0.12.4"
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
k256 = { version = "=0.13.4", features = ["schnorr"] }
base64 = "=0.22.1"
getrandom = "=0.4.3"
tungstenite = { version = "=0.28.0", features = ["native-tls"] }
if-addrs = "=0.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
