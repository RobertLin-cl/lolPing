[package]
name = "lolping-desktop-pilot"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
